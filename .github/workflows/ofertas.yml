name: Ofertas eBay

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, en el minuto 7 (hora UTC)
  workflow_dispatch:       # boton "Run workflow" para ejecutarlo a mano

permissions:
  contents: write          # para guardar enviados.json y no repetir ofertas

concurrency:
  group: ofertas
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar ofertas y enviar correo
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          KLEINANZEIGEN: "0"
        run: python ebay_ofertas.py

      - name: Guardar ofertas ya enviadas
        run: |
          if [ -f enviados.json ] && [ -n "$(git status --porcelain enviados.json)" ]; then
            git config user.name "ofertas-bot"
            git config user.email "ofertas-bot@users.noreply.github.com"
            git add enviados.json
            git commit -m "Actualizar ofertas enviadas"
            git push
          fi
